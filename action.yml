name: 'dock-desk'
description: 'AI Auditor that ensures Code matches Documentation.'
author: 'Srivatsa'
branding:
  icon: 'shield'  # Options: shield, lock, check, search, eye
  color: 'blue'   # Options: blue, green, yellow, red, purple
inputs:
  gemini_api_key:
    description: 'API Key (Gemini)'
    required: true
  github_token:
    description: 'GitHub Token for commenting'
    required: true
  code_file:
    description: 'Path to code file (Leave as "AUTO" to scan PR changes)'
    required: false
    default: 'AUTO'
  doc_file:
    description: 'Path to doc file'
    required: true
  fail_on_drift:
    description: 'Fail the workflow if drift is detected (true/false)'
    required: false
    default: 'true'
  groq_api_key:
    description: 'Groq API Key (Free fallback if Gemini quota exceeded)'
    required: false
  github_repository:
    description: 'GitHub Repository (owner/repo)'
    required: true
  pr_number:
    description: 'Pull Request Number'
    required: true
outputs:
  drift_detected:
    description: 'True if contradiction found'
  suggested_fix:
    description: 'The suggested fix content'
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - --code
    - ${{ inputs.code_file }}
    - --doc
    - ${{ inputs.doc_file }}
    - --fail-on-drift
    - ${{ inputs.fail_on_drift }}
  env:
    # 🚨 CRITICAL FIX: Map the input 'gemini_api_key' to the env var 'GEMINI_API_KEY'
    # The Python script reads os.getenv("GEMINI_API_KEY"), so this must match!
    GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
    GROQ_API_KEY: ${{ inputs.groq_api_key }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
    GITHUB_REPOSITORY: ${{ inputs.github_repository }}
    PR_NUMBER: ${{ inputs.pr_number }}
