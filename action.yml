name: 'DockDesk Neural Auditor'
description: 'Locally run semantic audit of code vs documentation using Ollama'
author: 'DockDesk Team'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  model:
    description: 'LLM Model to use (must be available in Ollama library)'
    required: false
    default: 'qwen2.5-coder:3b'
  
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    MODEL_NAME: ${{ inputs.model }}
