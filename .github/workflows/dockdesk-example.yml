# =============================================================================
# DockDesk Semantic Auditor - GitHub Actions Workflow (v2.1)
# =============================================================================
# This workflow runs DockDesk on every pull request to ensure documentation
# stays in sync with code changes. Copy this file to your repository's
# .github/workflows/ directory to enable automated semantic auditing.
#
# v2.1: Now uses Composite Action - ~30 second execution (no Docker build!)
# =============================================================================

name: DockDesk Audit

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      model:
        description: 'Ollama model to use'
        required: false
        default: 'qwen2.5-coder:3b'
        type: choice
        options:
          - qwen2.5-coder:1.5b
          - qwen2.5-coder:3b
          - qwen2.5-coder:7b
          - codellama:7b

jobs:
  audit:
    name: Semantic Audit
    runs-on: ubuntu-latest
    
    # Required: Ollama service container
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Wait for Ollama
        run: |
          echo "Waiting for Ollama service..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama ready!"
              break
            fi
            sleep 1
          done

      - name: Pull Model
        run: |
          echo "Pulling model..."
          curl -X POST http://localhost:11434/api/pull \
            -d '{"name": "${{ github.event.inputs.model || 'qwen2.5-coder:3b' }}"}' \
            -H "Content-Type: application/json"
          sleep 10

      # -----------------------------------------------------------------------
      # Run DockDesk Composite Action (Recommended - Fast!)
      # -----------------------------------------------------------------------
      - name: Run DockDesk Audit
        uses: srivatsa-source/dockdesk@main
        with:
          model: ${{ github.event.inputs.model || 'qwen2.5-coder:3b' }}
          fail_on_risk: 'HIGH'
          output_format: 'md'

      # -----------------------------------------------------------------------
      # Upload audit report as artifact
      # -----------------------------------------------------------------------
      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit_report.md
          retention-days: 30

      # -----------------------------------------------------------------------
      # Comment on PR with audit summary (optional)
      # -----------------------------------------------------------------------
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## DockDesk Audit Results\n\n';
            
            try {
              const report = fs.readFileSync('audit_report.md', 'utf8');
              const lines = report.split('\n').slice(0, 30);
              body += lines.join('\n');
              body += '\n\n---\n';
              body += '[View full report](' + 
                'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' + 
                ')';
            } catch (e) {
              body += 'Warning: Could not read audit report. Check the workflow logs for details.';
            }
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      # -----------------------------------------------------------------------
      # Upload SARIF for GitHub Code Scanning (optional)
      # -----------------------------------------------------------------------
      # Uncomment to enable GitHub Code Scanning integration
      #
      # - name: Run DockDesk with SARIF output
      #   uses: dockdesk/auditor@v2
      #   with:
      #     model: qwen2.5-coder:3b
      #     output_format: 'sarif'
      #
      # - name: Upload SARIF to GitHub
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: audit_report.sarif

# =============================================================================
# Configuration Guide
# =============================================================================
#
# Model Selection by Codebase Size:
#   - Small (<10k LOC):  qwen2.5-coder:1.5b or qwen2.5-coder:3b
#   - Medium (10-50k):   qwen2.5-coder:7b or codellama:7b
#   - Large (>50k):      qwen2.5-coder:14b
#
# Risk Thresholds:
#   - HIGH:   Only fail on critical issues (default)
#   - MEDIUM: Fail on moderate and critical issues
#   - LOW:    Fail on any issue
#
# =============================================================================
