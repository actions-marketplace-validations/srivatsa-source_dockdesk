name: DockDesk Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  audit:
    name: Documentation Drift Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          # Universal file patterns - works with any codebase
          files: |
            **/*.py
            **/*.js
            **/*.jsx
            **/*.ts
            **/*.tsx
            **/*.java
            **/*.go
            **/*.rs
            **/*.rb
            **/*.cpp
            **/*.c
            **/*.cs
            **/*.swift
            **/*.kt
            **/*.php
            **/*.scala
            **/*.vue
            **/*.svelte
          # Exclude test files and configs
          files_ignore: |
            **/*.test.*
            **/*.spec.*
            **/test/**
            **/tests/**
            **/__tests__/**
            **/node_modules/**
            **/vendor/**
            **/.git/**

      - name: Run DockDesk Agent
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: ./
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          groq_api_key: ${{ secrets.GROQ_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          pr_number: ${{ github.event.pull_request.number }}
          code_files: ${{ steps.changed-files.outputs.all_changed_files }}
          doc_file: 'AUTO'
          fail_on_drift: 'true'
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Skip - No Code Changes
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "No code changes detected. Skipping documentation audit."
