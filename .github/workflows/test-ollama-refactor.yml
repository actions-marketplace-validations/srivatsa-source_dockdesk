# =============================================================================
# Test Workflow for Ollama Refactor
# =============================================================================
# This workflow tests the refactored Ollama setup with background container
# instead of service containers. Trigger manually to validate the changes.
# =============================================================================

name: Test Ollama Refactor

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Ollama model to test'
        required: false
        default: 'qwen2.5-coder:3b'
        type: choice
        options:
          - qwen2.5-coder:1.5b
          - qwen2.5-coder:3b
          - qwen2.5-coder:7b

jobs:
  test-ollama:
    name: Test Ollama Background Setup
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Ollama Container
        run: |
          echo "Starting Ollama as detached container..."
          docker run -d -p 11434:11434 --name ollama ollama/ollama:latest
          echo "Ollama container started"

      - name: Wait for Ollama to be Ready
        run: |
          echo "Waiting for Ollama to be ready..."
          for i in {1..30}; do
            if curl -s --connect-timeout 2 http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✓ Ollama is ready!"
              break
            fi
            echo "  Waiting... ($i/30)"
            sleep 1
          done
          
          if ! curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "✗ Ollama failed to start"
            exit 1
          fi

      - name: Pull Model
        run: |
          MODEL="${{ github.event.inputs.model || 'qwen2.5-coder:3b' }}"
          echo "Pulling $MODEL..."
          
          curl -X POST http://localhost:11434/api/pull \
            -d '{"name": "'"$MODEL"'", "stream": false}' \
            -H "Content-Type: application/json"
          
          echo "Verifying model availability..."
          if curl -s http://localhost:11434/api/tags | grep -q "$MODEL"; then
            echo "✓ Model $MODEL is ready!"
          else
            echo "✗ Model pull failed"
            exit 1
          fi

      - name: Run DockDesk Audit
        uses: srivatsa-source/dockdesk@main
        with:
          model: ${{ github.event.inputs.model || 'qwen2.5-coder:3b' }}
          fail_on_risk: 'HIGH'
          output_format: 'md'
          ollama_host: 'http://localhost:11434'

      - name: Cleanup Ollama Container
        if: always()
        run: |
          echo "Stopping and removing Ollama container..."
          docker stop ollama || true
          docker rm ollama || true
          echo "✓ Cleanup complete"
