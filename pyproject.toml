[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockdesk"
version = "3.0.0"
description = "Local-first semantic documentation auditor using dual LLM models via Ollama"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["documentation", "auditor", "llm", "ollama", "semantic-drift", "code-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.28.0",
    "colorama>=0.4.6",
    "PyGithub>=1.55.0",
    "langgraph",
    "langchain",
    "langchain-community",
    "langchain-ollama",
    "gitpython",
    "pydantic>=2.0.0",
    "rich",
    "pathspec>=0.11.0",
    "numpy>=1.26.0",
    "discord.py>=2.4.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "langchain-huggingface",
]

[project.scripts]
dockdesk = "dockdesk.cli:main"

[project.urls]
Homepage = "https://github.com/srivatsa-source/dockdesk"
Repository = "https://github.com/srivatsa-source/dockdesk"
Issues = "https://github.com/srivatsa-source/dockdesk/issues"

[tool.setuptools.packages.find]
include = ["dockdesk*"]
exclude = ["dashboard*", "tests*"]

[tool.setuptools.package-data]
dockdesk = ["py.typed"]
